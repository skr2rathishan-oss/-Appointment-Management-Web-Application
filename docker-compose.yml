name: appointment-management

services:
  mysql:
    build: ./database
    container_name: ams-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ./server
      target: development
    container_name: ams-server
    restart: unless-stopped
    command: npm run dev:docker
    environment:
      NODE_ENV: development
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CLINIC_TZ: ${CLINIC_TZ:-Asia/Colombo}
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: development
    container_name: ams-client
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://server:5000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mysql_data:
